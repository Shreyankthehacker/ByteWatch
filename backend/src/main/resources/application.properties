spring.application.name=ByteWatch


#db properties 
spring.datasource.url=jdbc:postgresql://localhost:5432/bytewatch_db
spring.datasource.username=bytewatch_admin
spring.datasource.password=bytewatch

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



logging.level.org.springframework.security=DEBUG


jwt.secret=bytewatch-jwt-secret-key-2026-local-dev-32
jwt.expiration=3600000


video.storage.path=./storage/videos
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
ffmpeg.path=/usr/bin/ffmpeg
